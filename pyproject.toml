[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-benchmark-studio"
version = "0.1.0"
description = "An evaluation-driven platform for benchmarking Retrieval-Augmented Generation pipelines."
readme = "README.md"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]